<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Bing App Figma Prototype" />
    <title>Bing App · Figma Prototype</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=header-menu-1" />
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: var(--header-h) minmax(0, 1fr);
      }

      .site-header {
        position: relative;
        width: 100%;
        color: #fff;
        background: rgba(10, 10, 12, 0.78);
        box-shadow: inset 0 -1px rgba(255, 255, 255, 0.1);
      }

      .site-header.is-scrolled {
        box-shadow: inset 0 -1px rgba(255, 255, 255, 0.1);
      }

      .desktop-nav a {
        color: rgba(255, 255, 255, 0.66);
      }

      .desktop-nav a::after {
        background: #fff;
      }

      .menu-button {
        color: #fff;
        background: transparent;
        box-shadow: none;
      }

      .mobile-menu {
        color: #fff;
        background: rgba(18, 18, 20, 0.9);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.36);
      }

      .mobile-menu a {
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }

      .mobile-menu a:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }

      .prototype-stage {
        position: relative;
        width: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.68);
        font: 500 14px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .orientation-hint {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #fff;
        background: #000;
        text-align: center;
      }

      .orientation-phone {
        position: relative;
        width: 28px;
        height: 46px;
        border: 2px solid rgba(255, 255, 255, 0.86);
        border-radius: 8px;
        transform: rotate(90deg);
      }

      .orientation-phone::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        width: 7px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        transform: translateX(-50%);
      }

      .orientation-hint strong {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      iframe {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
        display: block;
        border: 0;
        background: #000;
      }

      @media (max-width: 820px) {
        :root {
          --header-h: calc(56px + env(safe-area-inset-top));
        }

        .site-header {
          padding-top: env(safe-area-inset-top);
          padding-right: max(18px, env(safe-area-inset-right));
          padding-left: max(18px, env(safe-area-inset-left));
        }

        .mobile-menu {
          right: max(18px, env(safe-area-inset-right));
          max-height: calc(100dvh - var(--header-h) - 16px);
          overflow-y: auto;
        }
      }

      @media (max-width: 600px) and (orientation: portrait) {
        .orientation-hint {
          display: flex;
        }
      }

      @media (max-height: 500px) and (orientation: landscape) {
        :root {
          --header-h: calc(52px + env(safe-area-inset-top));
        }

        .site-header {
          grid-template-columns: 1fr auto;
          padding-top: env(safe-area-inset-top);
          padding-right: max(18px, env(safe-area-inset-right));
          padding-left: max(18px, env(safe-area-inset-left));
        }

        .menu-button {
          width: 40px;
          height: 36px;
          min-width: 40px;
          display: inline-flex;
          gap: 0;
          padding: 0;
          border-radius: 0;
          color: #fff;
          background: transparent;
          box-shadow: none;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }

        .desktop-nav { display: none; }
        .header-actions { grid-column: 2; }

        .menu-button span {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        .mobile-menu {
          top: calc(100% + 6px);
          right: max(18px, env(safe-area-inset-right));
          max-height: calc(100dvh - var(--header-h) - 12px);
          overflow-y: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orientation-phone {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="desktop-nav" aria-label="主导航">
        <a href="./index.html#top">首页</a>
        <a href="./index.html#resume">简历</a>
        <a href="./index.html#work">项目</a>
        <a href="./index.html#contact">联系方式</a>
      </nav>

      <div class="header-actions">
        <button class="menu-button" type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu">
          <span>菜单</span>
          <i aria-hidden="true"></i>
        </button>
      </div>

      <nav class="mobile-menu" id="mobile-menu" aria-label="移动端导航" hidden>
        <a href="./index.html#top">01 · 首页</a>
        <a href="./index.html#resume">02 · 简历</a>
        <a href="./index.html#work">03 · 项目</a>
        <a href="./index.html#contact">04 · 联系方式</a>
      </nav>
    </header>

    <main class="prototype-stage">
      <div class="loading" aria-hidden="true">正在载入 Figma Prototype…</div>
      <div class="orientation-hint" role="status">
        <span class="orientation-phone" aria-hidden="true"></span>
        <strong>请横屏查看</strong>
      </div>
      <iframe
        title="Bing App Figma Prototype"
        src="https://embed.figma.com/proto/p45uUmqbEMFHhODJTEmhVP/Bing-app?node-id=5001-24672&amp;viewport=-221%2C255%2C0.1&amp;scaling=scale-down&amp;content-scaling=fixed&amp;page-id=0%3A1&amp;starting-point-node-id=5001%3A24672&amp;show-proto-sidebar=0&amp;hide-ui=1&amp;hotspot-hints=0&amp;embed-host=share&amp;t=0ZSvVoc93zYuj0yV-1"
        allowfullscreen
        allow="fullscreen; clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
    <script src="./script.js?v=head-turn-4"></script>
  </body>
</html>
